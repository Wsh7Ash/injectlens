[project]
name = "injectlens"
version = "0.1.0"
description = "Offline indirect prompt-injection scanner: normalization pipeline, 12 documented rules, hidden-text sanitizer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["prompt-injection", "llm-security", "scanner", "unicode", "indirect-prompt-injection"]
dependencies = []

[project.scripts]
injectlens = "injectlens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Scan defanged corpus (findings expected -> exit 1)
        run: |
          export PYTHONPATH=src
          python -m injectlens scan examples/corpus --format text || test $? -eq 1
      - name: Scan benign fixture (must be clean)
        run: |
          export PYTHONPATH=src
          python -m injectlens scan examples/corpus/benign-handbook.md
